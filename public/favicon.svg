<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ACVR">
  <!--
    Square brand mark for the browser tab.
    The full ACVR logo is a wide lock-up with text; shrunk to 16px it turns to
    mush, so this keeps only the graduation cap and the gold tassel, which
    stay readable at favicon sizes.
  -->
  <rect width="64" height="64" rx="13" fill="#16386e"/>

  <!-- Mortarboard top -->
  <path d="M32 15 56 25 32 35 8 25Z" fill="#ffffff"/>

  <!-- Cap body -->
  <path d="M18 29.2v10.3c0 4.1 6.3 7 14 7s14-2.9 14-7V29.2L32 35.4Z" fill="#ffffff" opacity=".9"/>

  <!-- Tassel -->
  <path d="M53 26.5v12" stroke="#f0a830" stroke-width="3.2" stroke-linecap="round" fill="none"/>
  <circle cx="53" cy="41.5" r="3.4" fill="#f0a830"/>
</svg>
